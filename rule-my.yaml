# Clash / Mihomo 分流片段：与节点订阅合并使用。
# 服务规则参考 https://github.com/luestr/ShuntRules ；基础白名单/广告/中国列表使用 ACL4SSR。
# USER-AGENT 条目不被 Mihomo 支持，内核会跳过；此文件使用域名/IP和下载器进程规则。
# 自动测速要求 HTTP 204；过滤订阅信息项；策略组候选顺序和默认选项保持不变。

proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇸🇬 狮城节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇰🇷 韩国节点
  - 🚀 手动切换
  - DIRECT
- name: 🚀 手动切换
  include-all: true
  type: select
  exclude-filter: (?i)剩余流量|流量重置|套餐到期|到期时间|距离下次重置|官网|订阅更新|traffic.*remaining|expire(?:s|d)?\s*[:：]
- name: ♻️ 自动选择
  type: url-test
  include-all: true
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  exclude-filter: (?i)剩余流量|流量重置|套餐到期|到期时间|距离下次重置|官网|订阅更新|traffic.*remaining|expire(?:s|d)?\s*[:：]
  expected-status: 204
  timeout: 5000
  lazy: true
