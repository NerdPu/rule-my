rules:
  # 本地域名先直连；随后使用局域网、白名单与广告规则
  - "DOMAIN-SUFFIX,ip6-localhost,🎯 全球直连"
  - "DOMAIN-SUFFIX,ip6-loopback,🎯 全球直连"
  - "DOMAIN-SUFFIX,internal,🎯 全球直连"
  - "DOMAIN-SUFFIX,lan,🎯 全球直连"
  - "DOMAIN-SUFFIX,local,🎯 全球直连"
  - "DOMAIN-SUFFIX,localhost,🎯 全球直连"
  - "DOMAIN-SUFFIX,miwifi.com,🎯 全球直连"
  - "RULE-SET,LocalAreaNetwork,🎯 全球直连"
  - "RULE-SET,UnBan,🎯 全球直连"
  - "RULE-SET,BanAD,🛑 广告拦截"
  - "RULE-SET,BanProgramAD,🍃 应用净化"
  # 原下载器进程优先直连，避免被 GitHub 等新增服务规则抢占
  - "PROCESS-NAME,aria2c.exe,🎯 全球直连"
  - "PROCESS-NAME,fdm.exe,🎯 全球直连"
  - "PROCESS-NAME,Folx.exe,🎯 全球直连"
  - "PROCESS-NAME,NetTransport.exe,🎯 全球直连"
  - "PROCESS-NAME,Thunder.exe,🎯 全球直连"
  - "PROCESS-NAME,Transmission.exe,🎯 全球直连"
  - "PROCESS-NAME,uTorrent.exe,🎯 全球直连"
  - "PROCESS-NAME,WebTorrent.exe,🎯 全球直连"
  - "PROCESS-NAME,WebTorrent Helper.exe,🎯 全球直连"
  - "PROCESS-NAME,qbittorrent.exe,🎯 全球直连"
  - "PROCESS-NAME,DownloadService.exe,🎯 全球直连"
  - "PROCESS-NAME,Weiyun.exe,🎯 全球直连"
  - "PROCESS-NAME,baidunetdisk.exe,🎯 全球直连"
  # 明确区分 GitHub Copilot 与 GitHub；Qwen 等国内 AI 归入 🇨🇳 国内AI
  - "DOMAIN,api.business.githubcopilot.com,✨ Copilot"
  - "DOMAIN-SUFFIX,githubcopilot.com,✨ Copilot"
  - "DOMAIN,copilot-proxy.githubusercontent.com,✨ Copilot"
  - "DOMAIN,copilot-telemetry.githubusercontent.com,✨ Copilot"
  - "DOMAIN-SUFFIX,qwen.ai,🇨🇳 国内AI"
  # 国内 AI 域名直连优先（可在 🇨🇳 国内AI 组切换为代理）
  - "DOMAIN,tongyi.aliyun.com,🇨🇳 国内AI"
  - "DOMAIN-SUFFIX,deepseek.com,🇨🇳 国内AI"
  - "DOMAIN-SUFFIX,moonshot.cn,🇨🇳 国内AI"
  - "DOMAIN-SUFFIX,kimi.com,🇨🇳 国内AI"
  - "DOMAIN-SUFFIX,doubao.com,🇨🇳 国内AI"
  - "DOMAIN-SUFFIX,volcengine.com,🇨🇳 国内AI"
  - "DOMAIN-SUFFIX,zhipuai.cn,🇨🇳 国内AI"
  - "DOMAIN-SUFFIX,bigmodel.cn,🇨🇳 国内AI"
  - "DOMAIN,yiyan.baidu.com,🇨🇳 国内AI"
  - "DOMAIN-SUFFIX,xfyun.cn,🇨🇳 国内AI"
  - "DOMAIN-SUFFIX,minimax.chat,🇨🇳 国内AI"
  # AI 专用规则优先；OpenAI 在 Copilot 前，避免其合并规则抢占 ChatGPT
  - "RULE-SET,OpenAi,💬 OpenAi"
  - "RULE-SET,Gemini,🎨 Gemini"
  - "RULE-SET,Claude,🎄 Claude"
  - "RULE-SET,Copilot,✨ Copilot"
  - "RULE-SET,Anthropic,🎄 Claude"
  - "RULE-SET,BardAI,🎨 Gemini"
  # aiXcoder 归入国内 AI；Civitai/Notion 及境外补充站走 🤖 AI 综合
  - "RULE-SET,aiXcoder,🇨🇳 国内AI"
  - "RULE-SET,Civitai,🤖 AI 综合"
  - "RULE-SET,Notion,🤖 AI 综合"
  # ShuntRules 未收录的境外 AI 站（Hugging Face / Perplexity / Grok / Midjourney / Character.AI）
  - "DOMAIN-SUFFIX,huggingface.co,🤖 AI 综合"
  - "DOMAIN-SUFFIX,hf.co,🤖 AI 综合"
  - "DOMAIN-SUFFIX,perplexity.ai,🤖 AI 综合"
  - "DOMAIN-SUFFIX,x.ai,🤖 AI 综合"
  - "DOMAIN-SUFFIX,grok.com,🤖 AI 综合"
  - "DOMAIN-SUFFIX,midjourney.com,🤖 AI 综合"
  - "DOMAIN-SUFFIX,character.ai,🤖 AI 综合"
  # 通讯与推送；FCM 必须在 GoogleCN、Google 前
  - "RULE-SET,Telegram,📲 电报消息"
  - "RULE-SET,Discord,💬 Discord"
  - "RULE-SET,GoogleFCM,📢 谷歌FCM"
  # 音乐与视频专用规则优先于 Apple、Google 和聚合媒体规则
  - "RULE-SET,Apple Music,🎵 Apple Music"
  - "RULE-SET,Spotify,🎧 Spotify"
  - "RULE-SET,NetEaseMusic,🎶 网易音乐"
  - "RULE-SET,BilibiliHMT,📺 哔哩哔哩"
  - "RULE-SET,Bilibili,📺 哔哩哔哩"
  - "RULE-SET,YouTube,📹 油管视频"
  - "RULE-SET,Netflix,🎥 奈飞视频"
  - "RULE-SET,Bahamut,📺 巴哈姆特"
  - "RULE-SET,TikTok,🎵 TikTok"
  # 具体服务先于微软、苹果等大类；国内 Steam CDN 仍直连
  - "RULE-SET,SteamCN,🎯 全球直连"
  - "RULE-SET,Bing,Ⓜ️ 微软Bing"
  - "RULE-SET,OneDrive,Ⓜ️ 微软云盘"
  - "RULE-SET,GitHub,🐙 GitHub"
  - "RULE-SET,GoogleCN,🎯 全球直连"
  - "RULE-SET,Google,🔎 谷歌服务"
  - "RULE-SET,Microsoft,Ⓜ️ 微软服务"
  - "RULE-SET,Apple,🍎 苹果服务"
  # 游戏与聚合媒体
  - "RULE-SET,Epic,🎮 游戏平台"
  - "RULE-SET,Origin,🎮 游戏平台"
  - "RULE-SET,Sony,🎮 游戏平台"
  - "RULE-SET,Steam,🎮 游戏平台"
  - "RULE-SET,Nintendo,🎮 游戏平台"
  - "RULE-SET,ChinaMedia,🌏 国内媒体"
  - "RULE-SET,ProxyMedia,🌍 国外媒体"
  # 下载站域名补充直连；下载器进程已在服务分流前匹配
  - "RULE-SET,Download,🎯 全球直连"
  # 海外通用规则、国内域名/IP 与最终兜底
  - "RULE-SET,ProxyGFWlist,🚀 节点选择"
  - "RULE-SET,ChinaDomain,🎯 全球直连"
  - "RULE-SET,ChinaCompanyIp,🎯 全球直连"
  - "GEOIP,CN,🎯 全球直连"
  - "MATCH,🐟 漏网之鱼"
